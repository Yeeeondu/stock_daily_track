<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신고가·신저가 보드</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="bar">
    <nav class="seg" id="markets">
      <button data-m="jp">🇯🇵 일본</button>
      <button data-m="us">🇺🇸 미국</button>
    </nav>
    <nav class="seg" id="views">
      <button data-v="newhigh">신고가</button>
      <button data-v="newlow">신저가</button>
      <button data-v="etf">ETF</button>
    </nav>
    <div class="datebox">
      <button id="prev" title="이전 거래일">◀</button>
      <select id="date"></select>
      <button id="next" title="다음 거래일">▶</button>
    </div>
  </div>
</header>

<main id="main"><p class="muted">불러오는 중…</p></main>

<footer class="foot">
  데이터: Yahoo Finance(yfinance) · 종목 목록: JPX, Wikipedia S&amp;P 1500 · 장 마감 후 자동 갱신 · 투자 권유 아님
</footer>

<dialog id="modal">
  <div class="mhead">
    <div>
      <div id="mtitle" class="mtitle"></div>
      <div id="msub" class="muted small"></div>
    </div>
    <button id="mclose" aria-label="닫기">✕</button>
  </div>
  <div class="mstats" id="mstats"></div>
  <div class="ranges" id="ranges">
    <button data-r="1">1M</button><button data-r="3">3M</button><button data-r="6">6M</button><button data-r="12" class="on">1Y</button>
  </div>
  <div id="chart"></div>
  <div class="mlinks" id="mlinks"></div>
</dialog>
</body>
</html>
