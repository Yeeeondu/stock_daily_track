name: Daily update

on:
  schedule:
    - cron: "10 7 * * 1-5"   # 한국·일본·대만: 16:10 KST (장 마감 후)
    - cron: "0 22 * * 1-5"   # 미국·ETF: 22:00 UTC = 한국 07:00 (장 마감 후)
  workflow_dispatch:
    inputs:
      market:
        description: "all 또는 쉼표로: us,kr,jp,etf,macro_us,macro_kr / none(사이트 파일만 갱신)"
        required: true
        default: "all"

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 어느 시장을 돌릴지 결정
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "market=${{ inputs.market }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "10 7 * * 1-5" ]; then
            echo "market=kr,jp,tw,macro_kr" >> "$GITHUB_OUTPUT"
          else
            echo "market=etf,macro_us,us" >> "$GITHUB_OUTPUT"
          fi

      - name: 차트 라이브러리 내려받기 (없을 때만)
        run: |
          f=docs/vendor/lightweight-charts.standalone.production.js
          if [ ! -s "$f" ]; then
            mkdir -p docs/vendor
            curl -fsSL -o "$f" https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js \
              || curl -fsSL -o "$f" https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js
            ls -l "$f"
          fi

      - name: 데이터 집계
        if: steps.m.outputs.market != 'none'
        run: python scripts/update.py --market "${{ steps.m.outputs.market }}"

      - name: 보조 정보 (PER·PSR·영문명, ETF 구성종목)
        if: steps.m.outputs.market != 'none'
        continue-on-error: true
        run: python scripts/update.py --market meta

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/vendor cache
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: ${{ steps.m.outputs.market }} $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
