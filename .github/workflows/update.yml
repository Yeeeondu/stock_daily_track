name: Daily update

on:
  workflow_dispatch:
    inputs:
      market:
        description: "all 또는 쉼표로: us,kr,jp,tw,etf,macro_us,macro_kr / none(사이트 파일만 갱신)"
        required: true
        default: "all"
  workflow_call:   # schedule.yml 이 매일 이 워크플로를 부른다
    inputs:
      market:
        type: string
        required: true

permissions:
  contents: write

jobs:
  update:
    concurrency:
      group: daily-update
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 어느 시장을 돌릴지 결정
        id: m
        run: echo "market=${{ inputs.market }}" >> "$GITHUB_OUTPUT"

      - name: 차트 라이브러리 내려받기 (없을 때만)
        run: |
          f=docs/vendor/lightweight-charts.standalone.production.js
          if [ ! -s "$f" ]; then
            mkdir -p docs/vendor
            curl -fsSL -o "$f" https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js \
              || curl -fsSL -o "$f" https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js
            ls -l "$f"
          fi

      - name: 데이터 집계
        if: steps.m.outputs.market != 'none'
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python scripts/update.py --market "${{ steps.m.outputs.market }}"

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/vendor cache
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: ${{ steps.m.outputs.market }} $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

  # 보조 정보(PER·PSR, ETF 구성종목)는 다른 머신에서 받는다 — 대량 다운로드한 머신은 Yahoo가 종목 정보 요청을 막기 때문
  meta:
    needs: update
    if: ${{ always() && inputs.market != 'none' }}
    concurrency:
      group: daily-update-meta
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 보조 정보 (PER·PSR, ETF 구성종목)
        continue-on-error: true
        run: python scripts/update.py --market meta
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data cache
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: 보조 정보 $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
